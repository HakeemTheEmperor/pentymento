# Every-PR pipeline (PRD 10.2): lint, unit tests with -race on Linux, macOS
# and Windows, commit-message and DCO check, the secret-leak test, the
# message-ID registry check, licence, vulnerability and security checks,
# and the integration subset (Postgres 17, MongoDB 8.0).
# Target: under 15 minutes.

name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint

  commits:
    name: commits and DCO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make commits RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  leaktest:
    name: secret leak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make leaktest

  messages:
    name: message IDs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make messages BASE=${{ github.event.pull_request.base.sha }}

  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
        shell: bash

  licenses:
    name: licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make licenses

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vulncheck

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make gosec

  integration:
    name: integration (postgres 17, mongodb 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PENTYM_TEST_POSTGRES: "17"
      PENTYM_TEST_MONGODB: "8.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-integration

  bench:
    # Microbenchmarks on the base and the head, compared with benchstat
    # (PRD 10.3). Time regressions over 10% become warning annotations; they
    # do not fail the job, because shared runners are too noisy to gate on.
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCH: -run ^$ -bench . -benchmem -count=6 -benchtime=200ms
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: benchmark the base
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          (cd "$RUNNER_TEMP/base" && go test $BENCH ./...) > "$RUNNER_TEMP/base.txt" || true
      - name: benchmark the head
        run: go test $BENCH ./... > "$RUNNER_TEMP/head.txt"
      - name: compare
        run: |
          {
            echo '## Benchmarks (base → head)'
            echo '```'
            make -s benchstat OLD="$RUNNER_TEMP/base.txt" NEW="$RUNNER_TEMP/head.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
