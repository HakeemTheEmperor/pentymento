# Nightly pipeline (PRD 10.2): the full database version matrix, plus chaos,
# long fuzzing, soak and golden-repository jobs, which later chunks fill in.

name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    # Each job runs the whole integration suite against one Postgres and one
    # MongoDB version; together the jobs cover every supported version.
    name: integration (postgres ${{ matrix.postgres }}, mongodb ${{ matrix.mongodb }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "16"
            mongodb: "7.0"
          - postgres: "17"
            mongodb: "8.0"
          - postgres: "18"
            mongodb: "9.0"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PENTYM_TEST_POSTGRES: ${{ matrix.postgres }}
      PENTYM_TEST_MONGODB: ${{ matrix.mongodb }}
      PENTYM_TEST_PROVIDERS: docker,local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Both instance providers must work (Build Order C12): install the
      # Postgres server binaries, and take mongod from the official image,
      # with mongodump for MongoDB snapshots (C14).
      - name: install local server binaries
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${PENTYM_TEST_POSTGRES}"
          mkdir -p "$HOME/mongodb/bin"
          id=$(docker create "mongo:${PENTYM_TEST_MONGODB}")
          docker cp "$id:/usr/bin/mongod" "$HOME/mongodb/bin/mongod"
          docker cp "$id:/usr/bin/mongodump" "$HOME/mongodb/bin/mongodump"
          docker rm "$id"
          "$HOME/mongodb/bin/mongod" --version
          "$HOME/mongodb/bin/mongodump" --version
          echo "PENTYM_TEST_POSTGRES_BIN=/usr/lib/postgresql/${PENTYM_TEST_POSTGRES}/bin" >> "$GITHUB_ENV"
          echo "PENTYM_TEST_MONGODB_BIN=$HOME/mongodb/bin" >> "$GITHUB_ENV"
      - run: make test-integration

  large-snapshot:
    # A 4 GiB synthetic stream must round-trip with flat memory, and a
    # slightly changed copy must deduplicate (Build Order C09).
    name: large snapshot (4 GiB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PENTYM_TEST_LARGE_MIB: "4096"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run '^(TestLargeSnapshot|TestBackupConstantMemory)$' -v -timeout 50m ./internal/repo/ ./internal/ops/

  repository-model:
    # Many more random sequences of writes, pins, crashes and restarts than
    # the pull-request run, which uses the race detector and so runs few
    # (Build Order C11).
    name: repository model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run '^TestRepositoryModel(Local)?$' -rapid.checks=500 -v -timeout 50m ./internal/repo/

  chaos:
    # Placeholder: kill, crash and network-fault tests.
    name: chaos
    runs-on: ubuntu-latest
    steps:
      - run: echo "no chaos tests yet"

  fuzz:
    # Placeholder: long fuzzing of every byte parser.
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - run: echo "no fuzz targets yet"

  soak:
    # Placeholder: hours under load with random kills.
    name: soak
    runs-on: ubuntu-latest
    steps:
      - run: echo "no soak test yet"

  golden:
    # Placeholder: golden repositories must stay readable.
    name: golden repositories
    runs-on: ubuntu-latest
    steps:
      - run: echo "no golden repositories yet"
